<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{% block title %}بوردیک{% endblock %}</title>
  {% block head_extra %}{% endblock %}
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232563eb'/%3E%3Cpath d='M18 33l9 9 19-20' fill='none' stroke='white' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}?v={{ asset_version }}">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>بوردیک</span>
      </a>
      {% if user %}
      <nav class="header-nav">
        <a class="nav-link" href="/projects">پروژه‌ها</a>
        <a class="nav-link" href="/my-tasks">وظایف من</a>
      </nav>
      <div class="user-area">
        <span class="notif" id="notif"
              data-feed-url="/ui/notifications/feed"
              data-read-url="/ui/notifications/read"
              data-csrf="{{ csrf_token }}">
          <button class="icon-btn notif-bell" type="button" id="notif-bell" title="اعلان‌ها">
            اعلان‌ها<span class="notif-count" id="notif-count" hidden></span>
          </button>
          <div class="notif-panel" id="notif-panel" hidden>
            <div class="notif-head">اعلان‌ها</div>
            <ul class="notif-list" id="notif-list"></ul>
            <p class="notif-hint" id="notif-hint" hidden></p>
            <button class="btn btn-ghost btn-small notif-enable" type="button" id="notif-enable" hidden>
              فعال‌سازی اعلان مرورگر
            </button>
          </div>
        </span>
        <span class="user-email" title="{{ user.full_name }}">{{ user.full_name }}</span>
        <form method="post" action="/logout">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button class="btn btn-ghost btn-small" type="submit">خروج</button>
        </form>
      </div>
      {% endif %}
    </div>
  </header>

  <main class="container page">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">ساخته‌شده با FastAPI و PostgreSQL · {{ current_year }}</div>
  </footer>

  <script src="{{ url_for('static', path='/notifications.js') }}?v={{ asset_version }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
