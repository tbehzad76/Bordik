<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <title>بوردیک — اتصال برقرار نشد</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="/static/icons/icon-192.png">
</head>
<body>
  <main class="container page">
    <section class="card offline-card">
      <h1>اتصال اینترنت برقرار نیست</h1>
      <p class="muted">
        برای دیدن وظایف و برد پروژه‌ها به اینترنت نیاز است. اتصال را بررسی کن و
        دوباره تلاش کن.
      </p>
      <button class="btn btn-primary" type="button" id="offline-retry">تلاش دوباره</button>
    </section>
  </main>
  <script>
    document.getElementById('offline-retry').addEventListener('click', function () {
      location.reload();
    });
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
