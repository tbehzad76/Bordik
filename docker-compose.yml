name: bordik
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tasks-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks -d tasks"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  app:
    build: .
    command:
      - sh
      - -c
      - >-
        alembic upgrade head &&
        exec uvicorn task_manager.main:app
        --host 0.0.0.0
        --port 8000
        --workers ${WEB_CONCURRENCY:-2}
        --proxy-headers
        --forwarded-allow-ips=172.19.0.4
    environment:
      DATABASE_URL: postgresql+psycopg://tasks:${POSTGRES_PASSWORD:-tasks-password}@db:5432/tasks
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in .env}
      AUTO_CREATE_TABLES: "false"
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      SESSION_DAYS: ${SESSION_DAYS:-30}
      COOKIE_SECURE: "true"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
